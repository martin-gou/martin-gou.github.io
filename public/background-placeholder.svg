<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1c2b3"/>
      <stop offset="0.45" stop-color="#b7b9c8"/>
      <stop offset="1" stop-color="#d6d2c8"/>
    </linearGradient>
    <radialGradient id="mint" cx="42%" cy="38%" r="68%">
      <stop offset="0" stop-color="#b9dfd3"/>
      <stop offset="0.58" stop-color="#75bbaa"/>
      <stop offset="1" stop-color="#123347"/>
    </radialGradient>
    <radialGradient id="violet" cx="48%" cy="42%" r="70%">
      <stop offset="0" stop-color="#8093d6"/>
      <stop offset="0.56" stop-color="#34468d"/>
      <stop offset="1" stop-color="#060927"/>
    </radialGradient>
    <radialGradient id="deep" cx="58%" cy="58%" r="68%">
      <stop offset="0" stop-color="#254e69"/>
      <stop offset="0.7" stop-color="#0d263d"/>
      <stop offset="1" stop-color="#030713"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="11"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.16"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#061020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="#1d2945" opacity="0.28"/>

  <ellipse cx="1130" cy="165" rx="420" ry="560" fill="url(#violet)" transform="rotate(-13 1130 165)" filter="url(#softShadow)"/>
  <ellipse cx="260" cy="745" rx="620" ry="430" fill="url(#mint)" transform="rotate(-23 260 745)" filter="url(#softShadow)"/>
  <ellipse cx="990" cy="930" rx="360" ry="460" fill="url(#deep)" transform="rotate(18 990 930)" opacity="0.88"/>

  <path d="M0 610 C270 675 500 640 705 470 C850 350 1010 250 1600 315 L1600 1000 L0 1000 Z" fill="#193654" opacity="0.32"/>
  <path d="M0 0 L1600 0 L1600 1000 L0 1000 Z" fill="url(#grain)" opacity="0.5"/>
  <path d="M-80 995 C240 880 510 720 735 460" fill="none" stroke="#d9e2de" stroke-opacity="0.52" stroke-width="7"/>
  <path d="M760 472 C1000 355 1265 345 1640 405" fill="none" stroke="#c8d6ef" stroke-opacity="0.24" stroke-width="3"/>
</svg>
